minReplicaCount: 1
maxReplicaCount: 2
targetCPUUtilizationPercentage: 60

image:
  repository: ghcr.io/truewebber/eve-online-mcp
  pullPolicy: Always
  tag: ""
  pullSecrets: []

app:
  port: 8765
  metricsPort: 8766
  listenHost: "0.0.0.0"
  internalListenHost: "0.0.0.0"
  public_url: ""
  contact: ""
  extra_redirect_uris: ""
  client_id: ""
  client_secret: ""
  database_url: ""
  hmac_key: ""

host: ""

ingress:
  enabled: false
  className: nginx
  clusterIssuer: ""
  tlsSecretName: ""
  hashByAuthorization: true
  annotations: {}

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

repo: "https://github.com/truewebber/eve-online-mcp"
