openapi: 3.0.3
info:
  title: EVE MCP HTTP API
  version: 0.3.0
  description: |
    Public HTTP surface of eve-mcp: OAuth for MCP clients and two
    human HTML pages. This is **not** the tool catalog.

    The service exposes one EVE Online character per connection. The
    player adds one URL in Cursor or Claude, signs in with EVE in the
    browser, and picks a character. That character *is* the connection —
    there is no server-side user above it. An alt is a second client
    entry with its own sign-in.

    The LLM never walks these paths to discover or call EVE tools.
    Clients open one URL:

        { "url": "http://127.0.0.1:8765/mcp" }

    That is MCP over Streamable HTTP (JSON-RPC), mounted next to the
    generated mux in `internal/service/http`. After OAuth the client
    sends `initialize`, then `tools/list`, then `tools/call`.
    Unauthenticated `/mcp` returns 401 + RFC 9728 `WWW-Authenticate`.

    `/mcp` is intentionally absent from `paths` below so oapi-codegen
    cannot steal the route.

    `/healthz` and `/readyz` live on the internal listener
    (`INTERNAL_LISTEN_HOST_PORT`, default `127.0.0.1:8766`) and are
    also absent: they are cluster-only and must not be routed
    publicly. `/healthz` is liveness (`{"status":"ok"}`, no
    dependency). `/readyz` is that plus a Postgres ping; it returns
    503 when the ping fails. `/metrics` is future (SPEC §11).

    Human failures on the EVE callback — refused login, short grant,
    unknown state — are HTML pages with a static sentence. They are
    never JSON and never echo CCP query strings or Go errors.

    The instance owns exactly one EVE application (`CLIENT_ID`).
    `/oauth/authorize` sends the browser to EVE SSO.
servers:
  - url: /
paths:
  /:
    get:
      operationId: getIndex
      summary: Human status page
      description: |
        How to connect and the exact EVE callback URL. No character
        data, no counts — it is world-readable.
      tags: [pages]
      responses:
        "200":
          description: HTML status
          content:
            text/html:
              schema:
                type: string
  /auth/login:
    get:
      operationId: getAuthLogin
      summary: Redirect to MCP authorize
      tags: [auth]
      responses:
        "302":
          description: Redirect to /oauth/authorize
  /auth/callback:
    get:
      operationId: getAuthCallback
      summary: EVE SSO callback
      description: |
        Completes the EVE login. Success redirects the browser back to
        the MCP client, or renders an HTML confirmation when no client
        redirect was stored. Failures render a static HTML catalog page
        (400 / 503 / 500). CCP `error` / `error_description` and Go
        errors stay in the log.
      tags: [auth]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Character authorized (no MCP client redirect)
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Back to the MCP client with an authorization code
        "400":
          description: Catalog HTML — refused, unknown, mismatch, short grant, or bad callback
          content:
            text/html:
              schema:
                type: string
        "503":
          description: Catalog HTML — login could not be finished
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Catalog HTML — unexpected failure
          content:
            text/html:
              schema:
                type: string
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: RFC 9728 protected resource metadata
      tags: [oauth]
      responses:
        "200":
          description: PRM
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/oauth-authorization-server:
    get:
      operationId: getAuthorizationServerMetadata
      summary: Authorization server metadata
      tags: [oauth]
      responses:
        "200":
          description: AS metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oauth/register:
    post:
      operationId: postOAuthRegister
      summary: Dynamic client registration
      tags: [oauth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterClient"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/authorize:
    get:
      operationId: getOAuthAuthorize
      summary: MCP authorize — redirects straight to EVE SSO
      description: |
        Validates the MCP client and redirect URI, then sends the browser
        to EVE SSO with the instance application. Without OAuth
        parameters it renders a human HTML hint. An unknown client is
        plain text, not the callback catalog.
      tags: [oauth]
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to EVE SSO
        "200":
          description: HTML hint (no OAuth parameters)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown client or redirect_uri (plain text)
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/token:
    post:
      operationId: postOAuthToken
      summary: Exchange code or refresh
      tags: [oauth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
components:
  schemas:
    RegisterClient:
      type: object
      required: [redirect_uris]
      properties:
        redirect_uris:
          type: array
          items:
            type: string
        client_name:
          type: string
    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
        refresh_token:
          type: string
        client_id:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        scope:
          type: string
    OAuthError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
