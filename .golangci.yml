# golangci-lint v2 — https://golangci-lint.run/docs/configuration/file/
# Version pinned in go.mod (tool directive); run via `make lint` / `go tool`.
version: "2"

run:
  # Paths in exclusions and linters are relative to go.mod, not cwd.
  relative-path-mode: gomod

linters:
  default: all
  disable:
    - varnamelen
    - funlen
    - gocyclo
    - cyclop
    - ireturn # conflicts with domain-exported interfaces
    - lll
    # Deprecated aliases. Replacements: wsl_v5 stays off (noisy autofix);
    # gomodguard_v2 is configured below; exhaustruct_v5 still forces zero fields.
    - wsl
    - wsl_v5
    - gomodguard
    - exhaustruct
    - exhaustruct_v5
    # Autofix rewrites `else if err := f(); err != nil` into invalid Go.
    - noinlineerr
    # Same-package tests for unexported helpers.
    - testpackage
    # JSON/YAML tag names follow OpenAPI / ESI / vendors, not a global case rule.
    - tagliatelle
    # RULES.md §6: comments are rare and explain why. Do not require them.
    - godoclint
  settings:
    godot:
      period: true
      capital: true
    errcheck:
      check-blank: true
      check-type-assertions: true
    nakedret:
      max-func-lines: 0
    # Default 1 flags a blank line before every return in a 2-statement
    # block (`x := 1; return x`). 2 leaves one-liners and `if err { return }`
    # alone; longer blocks still need the blank line.
    nlreturn:
      block-size: 2
    # Store suites share one DB per TestXxx; only top-level may Parallel.
    paralleltest:
      ignore-missing-subtests: true
    revive:
      # Listing any rule turns defaults off unless this is set.
      enable-default-rules: true
      rules:
        # RULES.md §6: names and types document; do not require a comment.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    # Direct go.mod requires only — not import paths (that is depguard).
    gomodguard_v2:
      local-replace-directives: true
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
          reason: use stdlib errors and fmt.Errorf with %w
        - module: github.com/sirupsen/logrus
          reason: use github.com/truewebber/gopkg/log
        - module: go.uber.org/zap
          reason: use github.com/truewebber/gopkg/log
        - module: github.com/rs/zerolog
          reason: use github.com/truewebber/gopkg/log
        - module: github.com/dgrijalva/jwt-go
          recommendations:
            - github.com/golang-jwt/jwt/v5
          reason: unmaintained; this module already uses jwt/v5
        - module: github.com/lib/pq
          recommendations:
            - github.com/jackc/pgx/v5
          reason: Postgres access is pgx only
        - module: github.com/mattn/go-sqlite3
          reason: durable store is Postgres, not SQLite
        - module: modernc.org/sqlite
          reason: durable store is Postgres, not SQLite
    depguard:
      rules:
        domain-boundaries:
          list-mode: lax
          files:
            - "**/internal/domain/*/*.go"
            - "!**/internal/domain/**/mocks/**/*.go"
          deny:
            - pkg: github.com/truewebber/eve-online-mcp/internal/domain/
              desc: domains must not import each other; use interfaces only
        service-no-domain:
          list-mode: lax
          files:
            - "**/internal/service/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/truewebber/eve-online-mcp/internal/domain/
              desc: service must not import domain; depend on usecase only
        banned-pkgs:
          list-mode: lax
          deny:
            - pkg: io/ioutil
              desc: use io and os — io/ioutil is deprecated
            - pkg: github.com/pkg/errors
              desc: use fmt.Errorf with %w / errors from stdlib
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: do not use fmt.Print* / print; use github.com/truewebber/gopkg/log
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)
          msg: do not use the standard library log; use github.com/truewebber/gopkg/log
        - pattern: ^slog\.(Debug|Info|Warn|Error|Default|New|Log|LogAttrs|With|WithGroup)
          msg: do not use slog; use github.com/truewebber/gopkg/log
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    # oapi-codegen output still typechecks via `go test ./...`.
    generated: lax
    warn-unused: true
    # Replaces v1 issues.exclude-use-default.
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - internal/service/http/api.gen.go

issues:
  # Defaults (50 / 3) hide the rest of a first-run report.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/truewebber/eve-online-mcp
  exclusions:
    generated: lax
    warn-unused: true
