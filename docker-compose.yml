# Postgres only. The eve-mcp binary runs on the host (`make run`).
# Kubernetes: LISTEN_HOST_PORT and INTERNAL_LISTEN_HOST_PORT = 0.0.0.0:{port},
# PUBLIC_URL required off loopback, liveness /healthz and readiness /readyz
# on the internal port.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_mcp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eve-mcp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_mcp"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  eve-mcp-pg:
    name: eve-mcp-pg
